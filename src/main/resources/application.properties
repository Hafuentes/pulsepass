spring.application.name=pulsepass

# Flyway y Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar ejecuciones automaticas de esquemas SQL clásicos
spring.sql.init.mode=never

# Seguridad (Fase 4). El secreto NUNCA va en el repositorio: se lee del entorno.
# Debe ser Base64 de al menos 32 bytes aleatorios (ej.: openssl rand -base64 32).
pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64:}
pulsepass.security.jwt.access-token-ttl=PT15M

# NFR-SEC006: todos los logs llevan el requestId (lo asigna RequestIdFilter; tambien sale en X-Request-Id).
logging.pattern.level=%5p [%X{requestId:-}]

# NFR-SEC008: CORS con origenes EXPLICITOS separados por coma (ej.: https://app.ejemplo.com). Vacio = CORS desactivado.
pulsepass.security.cors.allowed-origins=${PULSEPASS_CORS_ALLOWED_ORIGINS:}
