services:
  postgres:
    image: postgres:17
    container_name: pulsepass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsepass
      POSTGRES_USER: pulsepass
      POSTGRES_PASSWORD: pulsepass_local
    ports:
      - "5432:5432"
    volumes:
      - pulsepass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsepass -d pulsepass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulsepass_pgdata:
